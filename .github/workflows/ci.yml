name: CI
# 推送/PR:Go 质量 + amd64 构建 + ipk 组装 + OpenWrt rootfs 容器内 opkg 安装冒烟。
on:
  push:
    branches: ["**"]
  pull_request:

env:
  SMOKE_IMAGE: openwrt/rootfs:x86-64-23.05.6   # 对齐 iStoreOS 基线(22.03/23.05 系,opkg/ipk)
  SMOKE_IMAGE_APK: openwrt/rootfs:x86-64-25.12.5   # apk3 新代(opkg→apk 迁移后)

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto # 覆盖 setup-go v7 强制的 GOTOOLCHAIN=local,地板再抬时自动拉取
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # go-version 精确钉到 1.26.11(= go.mod 的 toolchain 地板;浮动 "1.26"
      # ⇒ runner 实际拿到的 patch 版本不保证 ≥ 地板 ⇒ 构建直接失败)。
      # GOTOOLCHAIN=auto:将来 setup-go 升到 v7(强制 GOTOOLCHAIN=local)时
      # 地板再抬也能自动拉取,而不是构建失败。
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
      # gofmt 门禁（2026-10-24 补）：此前 openwrt 仓的 CI **没有 gofmt 步**
      # （core/server/p2p/contracts/fnos 早已有）⇒ 格式漂移无人拦。
      # **发现即红，修法是 gofmt -w**，不设豁免。
      - name: Gofmt
        if: always()
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # 门禁步骤**互不阻塞**（if: always()）：此前是串行链 ⇒ 前一步失败 ⇒ 后面
      # 全部 skipped ⇒ 那些门禁等于没跑（core 仓实录：gofmt 先红 ⇒ race/lint/
      # 架构棘轮全被 skip ⇒ 真实 DATA RACE 藏在 main 上活了两列车）。
      - name: go vet + test
        if: always()
        run: |
          go vet ./...
          go test ./... -race
      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: 构建 linux/amd64 二进制
        if: always()
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          # GOWORK=off：钉版构建（否则在 hub 工作区里会联编本地 core ⇒ 版本幽灵）
          CGO_ENABLED=0 GOWORK=off GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s -X 'github.com/oekit/core/version.Version=${VERSION}'" \
            -o dist/pigeonbox ./cmd/pigeonbox
      # 钉版构建守卫（2026-10-26 审计 P2）：产物里的 core 版本必须 == DEPS.env
      # CORE_PIN；自证负对照=工作区构建显示 (devel) ⇒ GOWORK=off 是必需的。
      # 真机复验脚本是 **openwrt#110 关单的证据工具** ⇒ 判据必须能判红
      # ⇒ 用假设备（假 init.d/LuCI/curl/pgrep/id）驱动脚本自己
      # ⇒ 正常态绿、每条异常态都红、非 root 报「无法判定」。
      - name: 真机复验脚本判据自证（假设备必须逐条判红）
        run: bash scripts/verify-openwrt-runtime.sh --selfcheck
      # 出厂预接线（Beam↔Box 地址与专用 API Key）自测（2026-11-01）：
      # 预接线干两件**错了也不会有人喊**的事——① 建/复用一把 Box API Key；
      # ② 把地址+Key 写进 p2pcweb 配置。若它「每次启动都建一把新 Key」，
      # Key 列表会无声膨胀；若它发了空字段把用户配的 registry 冲掉，
      # 直传注册中心会静默丢失 ⇒ 两类都必须有**能判红**的机械化判据。
      # 本自测跑**真脚本**（假 Box + 假 p2pcweb），并带**变异负对照**证明判据有牙齿。
      - name: Beam 出厂预接线自测（幂等 + scope 精确 + 不冲 registry + 等就绪）
        run: bash scripts/prewire-beam-box-selftest.sh
      # iStore 上架 review（linkease/istore-repo#810）修复守卫：两类真机复现过的缺陷
      # （procd_set_param args 静默丢参 / LuCI ACL uci 项 ^pigeonbox$ 匹配不到配置名）
      # 当时 CI 全绿 ⇒ 必须有能判红的静态判据 + 变异自证。
      - name: iStore review 修复守卫（init 参数形态 + LuCI ACL 形态，自证判红）
        run: bash scripts/check-istore-review.sh --selfcheck
      # 升级前自动备份钩子(5.4.1):失败**有意不中止安装**(postinst 阶段 abort 只会把
      # 服务留在停机状态;flash 写满时 abort 是死结)⇒ 「快照没生成」与「生成了」
      # 在真机上看起来一模一样 ⇒ 必须有能判红的机械化判据 + 变异负对照。
      - name: 升级前备份钩子自测(轮转/空间守卫/不中止/截断校验/ UCI 解析,自证判红)
        run: bash scripts/preupgrade-backup-selftest.sh --selfcheck
      - name: 钉版构建守卫(core 版本 == DEPS.env CORE_PIN)
        if: always()
        run: bash scripts/check-build-pin.sh
      # 随包 p2pc + p2pcweb（2026-10-26 审计 P1）：打包脚本曾**只装 p2pcweb**、
      # apk 侧连 p2pcweb 都没有 ⇒ 装出来的包直传不可用，而流水线照样下载。
      # 下载口径收敛到 scripts/fetch-p2pc.sh（Makefile/CI/release 共用一份）。
      - name: 下载随包 p2pc/p2pcweb(DEPS.env P2PC_REF 钉版+sha256 校验)
        if: always()
        run: ./scripts/fetch-p2pc.sh x86_64-unknown-linux-gnu dist
      # pb CLI 随包（官方命令行客户端：doctor 部署自检等）。
      # 从 **server 同号 tag 的源码**编译（不是下载 Release 资产）——
      # 同号 tag 同时触发 ⇒ 下载资产会与 server 的 Release 流水线竞态；
      # git tag 立即可见 ⇒ 零竞态。详见 scripts/fetch-pb.sh 顶部说明。
      - name: 构建随包 pb CLI(server 同号 tag 源码)
        if: always()
        run: ./scripts/fetch-pb.sh x86_64-unknown-linux-gnu dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 构建前端 + 组装双格式包
        # apk3 版本格式严(数字段+letter+-rN),"ci" 这类后缀非法,CI 版本用纯 0.0.0
        # 额外组装 0.0.1：升级路径（同包升级 ⇒ postinst 重跑 ⇒ 服务仍须拉起）
        # 从未被断言过 ⇒ 「升级后服务不拉起」要到用户手里才暴露。
        if: always()
        run: |
          ./scripts/build-frontend.sh
          ./scripts/build-ipk.sh x86_64 0.0.0
          ./scripts/build-ipk.sh x86_64 0.0.1
          ./scripts/build-apk.sh x86_64 0.0.0
          ./scripts/build-apk.sh x86_64 0.0.1
      # 包内文件清单断言（不只看运行时存在性）：打包脚本漏装 p2pc 时，
      # 真正发布出去的那份同样漏装 ⇒ 必须在**包内**断言。
      - name: 包内文件清单断言(ipk 必须含 usr/bin/p2pc 与 p2pcweb)
        if: always()
        run: |
          # ⚠️ **CI 阶段不断言 usr/bin/pb**（2026-11-01）：
          # 此时 **server 的同号 tag 还不存在**（列车的 tag 阶段在 bump PR 全合之后）
          # ⇒ 本端从 server 源码编 pb 必然失败 ⇒ 包里确实没有 pb。
          # ⇒ 若此处硬断 ⇒ **bump PR 永远合不进去 ⇒ 列车死锁**。
          # ⇒ 「发布出去的包必须含 pb」的**真正断言点**在 release.yml
          #   （tag push 触发，那时 server tag 已可见 —— hub#232 加了顺序保证）。
          # ⚠️ usr/lib/pigeonbox/preupgrade_backup(5.4.1)**必须在这里断言**:
          #   它是 postinst 依赖的钩子文件,漏装时钩子 [ -x ] 不成立 ⇒ **静默跳过**,
          #   「升级前自动备份」变成文档里的空头承诺,而真机升级/冒烟全绿。
          #   与 2026-10-26 那次 p2pc P1 同一类失效模式(断言只看运行时存在性不够,
          #   必须断言**包内文件清单**)。
          ./scripts/assert-pkg-contents.sh dist/pigeonbox_0.0.0-1_x86_64.ipk \
            usr/bin/pigeonbox usr/bin/p2pc usr/bin/p2pcweb usr/bin/prewire_beam_box \
            usr/lib/pigeonbox/preupgrade_backup etc/init.d/pigeonbox
          ./scripts/assert-pkg-contents.sh dist/pigeonbox_0.0.1-1_x86_64.ipk \
            usr/bin/pigeonbox usr/bin/p2pc usr/bin/p2pcweb usr/bin/prewire_beam_box \
            usr/lib/pigeonbox/preupgrade_backup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-x86_64
          path: |
            dist/pigeonbox_*.ipk
            dist/pigeonbox-*.apk
          retention-days: 14
          if-no-files-found: error

  # web 类型检查**独立成 job**（2026-10-24）：此前它在 build job 里，而两个
  # 真机冒烟门禁（smoke-openwrt-ipk / smoke-openwrt-apk）都 `needs: build`
  # ⇒ build 里任何一步失败 ⇒ **两个真机冒烟门禁一起被 skip** ⇒ 冒烟等于没跑。
  # 实录：某次 `npm ci`（拉 frontend-core tgz 走网络）偶发失败 ⇒ 类型检查红
  # ⇒ 两个冒烟全 skip，而 UI 上只显示 build 红，看不出冒烟没跑。
  # ⇒ 拆出后：类型检查红**不再**吃掉冒烟门禁；前端类型真有问题时 vite build
  # 也会失败 ⇒ build 仍红 ⇒ 合并仍被挡（链条有效）。
  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # npm ci 走网络 ⇒ 偶发失败 ⇒ 加 --fetch-retries 让它自愈重试
      - name: web 类型检查(2026-10-09 拆仓:web/ 自包含,frontend-core tgz 钉版)
        run: cd web && npm ci --no-audit --no-fund --fetch-retries=3 --fetch-retry-mintimeout=20000 && npm run typecheck

  smoke-openwrt-ipk:
    # OpenWrt rootfs 容器内真装:opkg 按 Depends 自动拉 redis-server + postinst
    # 自动启用/启动 + /ping 探活。
    # 幂等重跑作为显式断言:**装第二个版本 = 真实升级路径**（postinst 重跑、
    # 服务 restart、LuCI ACL 重载）——此前只装一次 ⇒ 升级路径从未被断言。
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-x86_64
          path: dist
      - name: opkg 安装冒烟(全新安装 + 升级路径 + 随包 p2pc)
        # rootfs 镜像默认 Cmd 为空会秒退,须显式 /sbin/init 起 OpenWrt 引导
        # (procd 托管 + postinst 自动启用/启动),再 exec 进去做断言。
        run: |
          docker rm -f fcb-smoke >/dev/null 2>&1 || true
          docker run -d --name fcb-smoke -v "$PWD/dist:/pkg:ro" "${SMOKE_IMAGE}" /sbin/init
          sleep 10
          docker exec fcb-smoke sh -eux -c '
            opkg update >/dev/null
            opkg install /pkg/pigeonbox_0.0.0-1_x86_64.ipk
            sleep 3
            wget -qO- http://127.0.0.1:12345/ping
            # 配置收紧(openwrt#199):明文管理员口令/Redis 密码存 UCI,打包 0644
            # ⇒ 安装钩子必须收紧到 600(rootfs 无 stat applet ⇒ 用 ls -l 判据)。
            # 负对照:去掉安装钩子里的 chmod ⇒ 本行必须红。
            test "$(ls -l /etc/config/pigeonbox | cut -c1-10)" = "-rw-------"
            # notifies 表回归断言(env-only auto_migrate 门控曾致缺表 500,core v0.13.1 修)
            wget -qO- http://127.0.0.1:12345/notifies/active | grep -q "\"code\":0"
            logread | grep -i "redis initialized"
            # 随包 p2pc 直传二进制必须存在(2026-10-26 审计 P1:ipk 曾只装 p2pcweb
            # ⇒ OpenWrt 全系直传不可用,而发布物仍宣称随包 p2pc)
            test -x /usr/bin/p2pc
            test -x /usr/bin/p2pcweb
            # 升级路径:装新版本 ⇒ postinst 重跑 ⇒ 服务仍须拉起(负对照:
            # 在 pigeonbox.postinst 注入 exit 1 ⇒ 本步必须红)
            opkg install /pkg/pigeonbox_0.0.1-1_x86_64.ipk
            sleep 3
            wget -qO- http://127.0.0.1:12345/ping
            # 升级路径的权限重申(openwrt#199):conffile 被包内 0644 新版替换后
            # 安装钩子必须再收紧(去 chmod ⇒ 升级断言必红)
            test "$(ls -l /etc/config/pigeonbox | cut -c1-10)" = "-rw-------"
            test -x /usr/bin/p2pc
            # 升级前自动备份(5.4.1):**真实升级**后必须留下升级前的业务库快照。
            # 断言只能放在第二次安装之后——首装时库里还没有业务库,钩子按设计静默
            # 跳过;只有升级才有可备份对象。负对照:把 postinst 里的钩子调用注释掉
            # ⇒ 本步必须红。
            test -x /usr/lib/pigeonbox/preupgrade_backup
            bak_found=""
            for bak_dir in "$(uci -q get pigeonbox.main.data_dir 2>/dev/null || true)" /etc/pigeonbox/data; do
              [ -n "$bak_dir" ] || continue
              for bak_f in "$bak_dir"/fileCodeBox.db.bak-*; do
                [ -f "$bak_f" ] && bak_found="$bak_f"
              done
            done
            test -n "$bak_found"
            echo "升级前快照: $bak_found"
          '
          docker rm -f fcb-smoke

  smoke-openwrt-apk:
    # apk3 新代(25.12):apk add 按 depends 自动拉 redis-server + post-install
    # 脚本启用/启动 + /ping 探活。CI 构建未签名(密钥只在 release),故
    # --allow-untrusted;发布产物为签名包,受信安装已在 v0.2.0 容器实测。
    # 同样断言**升级路径**（装第二个版本 ⇒ post-install 重跑）。
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-x86_64
          path: dist
      - name: apk 安装冒烟(全新安装 + 升级路径 + 随包 p2pc)
        run: |
          docker rm -f fcb-smoke-apk >/dev/null 2>&1 || true
          docker run -d --name fcb-smoke-apk "${SMOKE_IMAGE_APK}" /sbin/init
          sleep 10
          docker cp dist/pigeonbox-0.0.0-r0_x86_64.apk fcb-smoke-apk:/tmp/pigeonbox-0.0.0.apk
          docker cp dist/pigeonbox-0.0.1-r0_x86_64.apk fcb-smoke-apk:/tmp/pigeonbox-0.0.1.apk
          docker exec fcb-smoke-apk sh -eux -c '
            apk update >/dev/null
            apk add --allow-untrusted /tmp/pigeonbox-0.0.0.apk
            sleep 3
            wget -qO- http://127.0.0.1:12345/ping
            # 配置收紧(openwrt#199):明文管理员口令/Redis 密码存 UCI,打包 0644
            # ⇒ 安装钩子必须收紧到 600(rootfs 无 stat applet ⇒ 用 ls -l 判据)。
            # 负对照:去掉安装钩子里的 chmod ⇒ 本行必须红。
            test "$(ls -l /etc/config/pigeonbox | cut -c1-10)" = "-rw-------"
            # notifies 表回归断言(env-only auto_migrate 门控曾致缺表 500,core v0.13.1 修)
            wget -qO- http://127.0.0.1:12345/notifies/active | grep -q "\"code\":0"
            logread | grep -i "redis initialized"
            # 随包 p2pc + p2pcweb(apk 数据树此前两者皆无 ⇒ 直传不可用)
            test -x /usr/bin/p2pc
            test -x /usr/bin/p2pcweb
            # 升级路径:装新版本 ⇒ post-install 重跑 ⇒ 服务仍须拉起(负对照:
            # 在 pigeonbox.post-install 注入 exit 1 ⇒ 本步必须红)
            apk add --allow-untrusted /tmp/pigeonbox-0.0.1.apk
            sleep 3
            wget -qO- http://127.0.0.1:12345/ping
            # 升级路径的权限重申(openwrt#199):conffile 被包内 0644 新版替换后
            # 安装钩子必须再收紧(去 chmod ⇒ 升级断言必红)
            test "$(ls -l /etc/config/pigeonbox | cut -c1-10)" = "-rw-------"
            test -x /usr/bin/p2pc
            # 升级前自动备份(5.4.1):post-install 同时挂在 post-upgrade 上 ⇒
            # apk 升级路径也必须留下升级前快照。ADB 包无法 tar 解包列清单,
            # 故 apk 侧的「包内含该文件」与「升级时确实跑了」在这里一并断言。
            test -x /usr/lib/pigeonbox/preupgrade_backup
            bak_found=""
            for bak_dir in "$(uci -q get pigeonbox.main.data_dir 2>/dev/null || true)" /etc/pigeonbox/data; do
              [ -n "$bak_dir" ] || continue
              for bak_f in "$bak_dir"/fileCodeBox.db.bak-*; do
                [ -f "$bak_f" ] && bak_found="$bak_f"
              done
            done
            test -n "$bak_found"
            echo "升级前快照: $bak_found"
          '
          docker rm -f fcb-smoke-apk
