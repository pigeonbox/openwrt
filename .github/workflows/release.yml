name: Release
# 打 v* tag → 双架构 ipk 发布:
#   1. build: 矩阵(x86_64/aarch64_generic)交叉编译 Go + 构建前端 + 组装 ipk
#   2. release: 双 ipk 挂本仓 Release(GITHUB_TOKEN 同仓写即可)
#   3. attach-to-hub: 回挂到生态主仓 pigeonbox/pigeonbox 的 Release(tag openwrt-v*,
#      与 fnos-v*/desktop-v* 同模式——二进制产物统一在主仓 Releases 可下载;
#      跨仓写用 OPENWRT_PAT;断链必须响(2026-10-08 拔除 continue-on-error——
#      PAT 失效静默放行只会让 hub 统一出口缺资产))
# workflow_dispatch: 传 version(现有 tag 名)对该版本手动重跑 ipk 打包+双挂
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本(现有 tag 名,如 v0.1.0)。仅重跑 ipk 打包+双挂'
        required: true
        type: string

concurrency:
  # 手动 dispatch 重跑与 tag 自动触发可能并发写同一 Release(--clobber:先写者被
  # 静默覆盖,不报错)。按目标版本分组串行;cancel-in-progress:false——发布中途
  # 取消比排队更糟。键取目标版本而非 github.ref:dispatch 的 ref 是分支、
  # tag 触发的 ref 是 tag,用 ref 分组等于没分组。
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

# 默认只读;真正要写本仓 Release 的作业在作业级单独开 contents: write
permissions:
  contents: read

jobs:
  build:
    env:
      GOTOOLCHAIN: auto # 覆盖 setup-go v7 强制的 GOTOOLCHAIN=local,地板再抬时自动拉取
    strategy:
      matrix:
        include:
          - arch: x86_64
            goarch: amd64
          - arch: aarch64_generic
            goarch: arm64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 手动 dispatch 时按输入版本检出对应 tag,产物与 tag 严格一致
          ref: ${{ inputs.version || github.ref_name }}
      - name: 版本一致性断言(VERSION/go.mod 钉版与 DEPS.env 对齐)
        run: |
          VER=${{ inputs.version || github.ref_name }}
          if [ -f VERSION ]; then
            [ "$(cat VERSION)" = "${VER#v}" ] || { echo "::error::VERSION=$(cat VERSION) ≠ tag $VER——发版走 hub 列车 bump,勿手改 VERSION"; exit 1; }
            . ./DEPS.env
            grep -q "github.com/pigeonbox/core ${CORE_PIN}" go.mod || { echo "::error::go.mod core 钉版 ≠ DEPS.env CORE_PIN=${CORE_PIN}(fnos v1.2.7 悬空钉版守卫)"; exit 1; }
          fi
      # 前端自包含在本仓 web/(frontend-core tgz 钉版=web/package.json),无需读壳仓 ref
      # go-version 精确钉到 1.26.10(= go.mod 的 toolchain 地板;浮动 "1.26"
      # ⇒ runner 实际拿到的 patch 版本不保证 ≥ 地板 ⇒ 构建直接失败)。
      # GOTOOLCHAIN=auto:将来 setup-go 升到 v7(强制 GOTOOLCHAIN=local)时
      # 地板再抬也能自动拉取,而不是构建失败。
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: 交叉编译(CGO_ENABLED=0,纯 Go sqlite)
        run: |
          # GOWORK=off:钉版构建(否则在 hub 工作区里会联编本地 core ⇒ 版本幽灵)
          CGO_ENABLED=0 GOWORK=off GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-w -s \
            -X 'github.com/oekit/core/version.Version=${{ inputs.version || github.ref_name }}' \
            -X 'github.com/oekit/core/version.BuildCommit=${{ github.sha }}' \
            -X 'github.com/oekit/core/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)'" \
            -o dist/pigeonbox ./cmd/pigeonbox
      - name: 随包 p2pc(DEPS.env P2PC_REF 钉版+sha256 校验)
        # 下载口径与 CI/Makefile 共用 scripts/fetch-p2pc.sh(2026-10-26 审计 P1:
        # 此前下载逻辑三处各抄一份 ⇒ 已经漂移过一次 ⇒ 打包脚本漏装 p2pc 而
        # 流水线照样下载 ⇒ 装出来的包直传不可用)。
        run: |
          case "${{ matrix.goarch }}" in
            amd64) triple=x86_64-unknown-linux-gnu ;;
            arm64) triple=aarch64-unknown-linux-gnu ;;
          esac
          ./scripts/fetch-p2pc.sh "$triple" dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: 前端构建 + 双格式打包(ipk + 签名 apk)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          # 前端自包含在本仓 web/(钉版可复现性=web/package.json 的 frontend-core tgz)
          ./scripts/build-frontend.sh
          VERSION="${{ inputs.version || github.ref_name }}"
          ./scripts/build-ipk.sh ${{ matrix.arch }} "${VERSION#v}"
          # aarch64 额外出 aarch64_cortex-a53 ipk 变体(iStore 官方源收录要求的
          # opkg 架构名;同一 arm64 静态二进制,仅 control 元数据不同),提交 istore-repo 直接取用
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            ./scripts/build-ipk.sh aarch64_cortex-a53 "${VERSION#v}"
          fi
          # 签名私钥(GH secret,PEM)落盘供 mkpkg --sign-key;公钥 keys/pigeonbox.pem 已入库
          echo "${APK_SIGN_KEY}" > /tmp/apk-sign.key
          APK_SIGN_KEY=/tmp/apk-sign.key ./scripts/build-apk.sh ${{ matrix.arch }} "${VERSION#v}"
      # 包内文件清单断言（发布物级）：**真正发出去的包**必须含随包 p2pc/p2pcweb。
      # 打包脚本漏装时 CI 冒烟那份也会漏 ⇒ 必须在发布链路上再断言一次。
      - name: 发布包内文件清单断言(含随包 p2pc/p2pcweb)
        run: |
          set -euo pipefail
          VER="${{ inputs.version || github.ref_name }}"
          for f in dist/pigeonbox_${VER#v}-1_*.ipk; do
            [ -f "$f" ] || continue
            ./scripts/assert-pkg-contents.sh "$f" usr/bin/pigeonbox usr/bin/p2pc usr/bin/p2pcweb
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/pigeonbox_*.ipk
            dist/pigeonbox-*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-x86_64
          path: rel
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-aarch64_generic
          path: rel
      - name: 挂本仓 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "${VER}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${VER}" --repo "${GITHUB_REPOSITORY}" \
              --title "PigeonBox OpenWrt/iStoreOS ${VER}" \
              --notes "OpenWrt/iStoreOS 原生包(见 Assets)。双格式双架构:opkg 系(22.03/23.05,含 iStoreOS 现行版)装 *_<arch>.ipk;apk3 系(25.12+)装 *-r0_<arch>.apk(先按 README 预置公钥 keys/pigeonbox.pem)。前端自包内 web/(frontend-core tgz 钉版)。"
          gh release upload "${VER}" rel/*.ipk rel/*.apk --repo "${GITHUB_REPOSITORY}" --clobber

  attach-to-hub:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-x86_64
          path: rel
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packages-aarch64_generic
          path: rel
      - name: 回挂包到生态主仓
        env:
          GH_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: openwrt-${{ inputs.version || github.ref_name }}
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          NOTES=$(printf '%s\n\n---\n🗂 **组件仓库**: [pigeonbox/openwrt](https://github.com/pigeonbox/openwrt) · **完整变更日志**: [%s](https://github.com/pigeonbox/openwrt/releases/tag/%s)\n🌐 **生态总览 / Latest**: [pigeonbox/pigeonbox](https://github.com/pigeonbox/pigeonbox/releases/latest)\n' \
            "OpenWrt/iStoreOS 原生包(见 Assets)。安装说明见 openwrt 仓 README。" "${VER}" "${VER}")
          gh release view "${TAG}" --repo pigeonbox/pigeonbox >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo pigeonbox/pigeonbox \
              --title "PigeonBox OpenWrt/iStoreOS ${VER}" \
              --latest=false \
              --notes "${NOTES}"
          gh release upload "${TAG}" rel/*.ipk rel/*.apk --repo pigeonbox/pigeonbox --clobber
          # 组件回挂恒不为 Latest(Latest 属于 hub 生态快照 v*);release 已存在时也兜底纠偏
          gh release edit "${TAG}" --repo pigeonbox/pigeonbox --latest=false || true
          echo "已回挂到 pigeonbox/pigeonbox Releases"

      - name: 回调 hub 列车编排器(唤醒 advance 核对完成度;回调丢失由 hub 15 分钟 sweep 兜底,不阻断发布)
        env:
          CB_TOKEN: ${{ secrets.PB_BOT_TOKEN }}
          TAG: openwrt-${{ inputs.version || github.ref_name }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $CB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pigeonbox/pigeonbox/dispatches \
            -d "{\"event_type\":\"train-advance\",\"client_payload\":{\"component\":\"openwrt\",\"tag\":\"$TAG\"}}" \
            || echo "::warning::hub 回调失败(train-orchestrator sweep 兜底)"
